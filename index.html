<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Footwear Stock, Barcode & POS Manager</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html5-qrcode for Camera Barcode Scanning -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- JsBarcode for Barcode Label Generation -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
      .no-print { display: none !important; }
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes laser {
      0% { top: 5%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.8; }
    }
    .scanner-laser {
      animation: laser 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col pb-16">

  <!-- TOP APP BAR -->
  <header class="bg-indigo-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-2 rounded-xl text-indigo-900 shadow">
          <i data-lucide="footprints" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
            DN Footwear & Sports
            <span class="text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider">Stock POS</span>
          </h1>
          <p class="text-xs text-indigo-200">Barcode Scanner & Smart Inventory</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="openScannerModal('sale')" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-medium px-3 py-2 rounded-lg text-sm flex items-center gap-1.5 shadow-sm transition">
          <i data-lucide="scan" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Bikri Scan</span>
        </button>
        <button onclick="openScannerModal('inward')" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium px-3 py-2 rounded-lg text-sm flex items-center gap-1.5 shadow-sm transition">
          <i data-lucide="box" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Stock Inward (+)</span>
        </button>
        <button onclick="openPOSModal()" class="relative bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-2 rounded-lg text-sm flex items-center gap-1.5 shadow transition">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          <span id="cartCountBadge" class="hidden absolute -top-1.5 -right-1.5 bg-rose-600 text-white text-[11px] font-bold px-1.5 py-0.2 rounded-full border-2 border-white">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- DASHBOARD STATS -->
  <main class="max-w-7xl mx-auto px-4 py-4 w-full flex-1">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase">Kul Footwear Pair</p>
          <h3 id="statTotalPairs" class="text-2xl font-bold text-slate-900 mt-0.5">0</h3>
          <p id="statModelCount" class="text-[11px] text-slate-400">0 Models listed</p>
        </div>
        <div class="bg-indigo-50 p-2.5 rounded-xl text-indigo-600">
          <i data-lucide="boxes" class="w-6 h-6"></i>
